<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 6 — Story | Rule-Runners</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .story-page {
      display: flex;
      flex-direction: column;
      flex: 1;
      align-items: center;
    }

    .story-hero {
      width: 100%;
      padding: 50px 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .story-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 80% 60% at 50% 0%,
        rgba(0,128,255,0.15) 0%,
        transparent 70%
      );
    }

    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 4px;
      line-height: 1.1;
      position: relative;
      margin-bottom: 10px;
    }

    .hero-title span {
      color: var(--accent-cyan);
      text-shadow: var(--glow-cyan);
    }

    .story-question {
      max-width: 1000px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-secondary);
      position: relative;
      margin: 0;
      padding: 0 20px;
    }

    .story-workspace {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 24px 40px;
      align-items: start;
    }

    .story-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .story-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }

    .story-panel h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .story-input {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      background: #060c18;
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      font-family: inherit;
      outline: none;
    }

    .story-input::placeholder {
      color: var(--text-dim);
    }

    .draw-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .draw-btn {
      padding: 8px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .draw-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }

    .draw-box {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 16px;
      position: relative;
    }

    .draw-box::after {
      content: 'DRAW';
      position: absolute;
      top: 10px;
      right: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      color: var(--accent-green);
      letter-spacing: 2px;
    }

    #story-canvas {
      width: 100%;
      height: 320px;
      display: block;
      background: #ffffff;
      border: 1px solid var(--border);
      cursor: crosshair;
      touch-action: none;
    }

    .story-footer {
      width: 100%;
      max-width: 1100px;
      padding: 0 40px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .story-workspace {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      .story-footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .story-hero {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <header class="app-header" data-phase="06"></header>
  <script src="js/nav.js"></script>

  <div class="story-page">
    <div class="story-hero">
      <div class="grid-bg"></div>
      <h1 class="hero-title"><span>Story</span> Builder</h1>
      <p class="story-question">
        Create a scenario with rule-based AI. What are the rules? What are the conditions? What are the sensors?
      </p>
    </div>

    <div class="story-workspace">
      <div class="story-panel">
        <h3>✍️ Write Your Scenario</h3>
        <textarea
          class="story-input"
          id="storyText"
          placeholder="Write your scenario here..."
        ></textarea>
      </div>

      <div class="story-panel">
        <h3>🎨 Draw Your Scenario</h3>
        <div class="draw-box">
          <div class="draw-toolbar">
            <button class="draw-btn" id="undoBtn" type="button">Undo</button>
            <button class="draw-btn" id="clearBtn" type="button">Clear</button>
          </div>
          <canvas id="story-canvas" width="500" height="320"></canvas>
        </div>
      </div>
    </div>

    <div class="story-footer">
      <a class="btn btn-secondary" href="compete.html">← Back</a>
      <a class="btn" id="story-next-btn" href="index.html">Next →</a>
    </div>
  </div>

  <script src="js/dataCollection.js"></script>
  <script>
    const canvas = document.getElementById('story-canvas');
    const ctx = canvas.getContext('2d');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');

    let drawing = false;
    let currentStroke = [];
    let strokes = [];

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (const stroke of strokes) {
        if (stroke.length < 2) {
          const p = stroke[0];
          ctx.beginPath();
          ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
          continue;
        }

        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      drawing = true;
      currentStroke = [];
      const p = getPos(e);
      currentStroke.push(p);
      strokes.push(currentStroke);
      redraw();
      e.preventDefault();

      // ── DATA COLLECTION: drawing started
      dcStory_startDrawing();
    }

    function draw(e) {
      if (!drawing) return;
      const p = getPos(e);
      currentStroke.push(p);
      redraw();
      e.preventDefault();
    }

    function endDraw() {
      if (!drawing) return;
      drawing = false;
      currentStroke = [];

      // ── DATA COLLECTION: drawing paused (pen lifted)
      dcStory_stopDrawing();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', endDraw);

    undoBtn.addEventListener('click', () => {
      if (strokes.length > 0) {
        strokes.pop();
        redraw();
      }
    });

    clearBtn.addEventListener('click', () => {
      strokes = [];
      redraw();
    });

    redraw();

    // ── DATA COLLECTION: start page timer, click counter, story bucket
    // and track typing time on the textarea
    dcStory_start();

    const storyTextEl = document.getElementById('storyText');
    storyTextEl.addEventListener('focus', dcStory_startTyping);
    storyTextEl.addEventListener('blur',  dcStory_stopTyping);

    // ── DATA COLLECTION: save data when Next is clicked
    document.getElementById('story-next-btn').addEventListener('click', () => {
      dcStory_recordSubmit({
        scenarioText  : storyTextEl.value,
        drawingDataUrl: canvas.toDataURL('image/png'),
      });
    });
  </script>
</body>
</html>
